[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling",
]

[project]
name = "grinta"
version = "1.0.0"
description = "The local-first coding agent that survives failures and finishes long tasks"
readme = "README.md"
keywords = [
  "ai-agent",
  "autonomous-agent",
  "coding-agent",
  "debugger",
  "developer-tools",
  "llm",
  "local-ai",
  "lsp",
  "terminal",
]
license = "MIT"
authors = [ { name = "Youssef Mejdi" } ]
requires-python = ">=3.12,<3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dependencies = [
  "aiohttp>=3.14.3",
  "anthropic>=1.4.0,<2",
  "anyio>=4.15.1,<5",
  "bashlex>=0.18,<0.19",
  "binaryornot>=0.6,<0.7",
  "chardet>=7.6,<8",
  "charset-normalizer>=3.5.1,<4",
  "fastmcp>=4.0.3,<5",
  "google-genai>=2.22",
  "httpx>=0.28.1,<1",
  "json-repair>=0.63.4,<1",
  "libtmux>=0.62,<0.63",
  # FastMCP 4 requires MCP 2.x.
  "mcp>=2.1.1,<3",
  "openai>=3.8,<4",
  "orjson>=3.12,<4",
  "pathspec>=1.1.1,<2",
  "prompt-toolkit>=3.0.53,<4",
  "psutil>=7.2.2,<8",
  "ptyprocess>=0.7,<1; sys_platform!='win32'",
  "pyfiglet>=1.0.4",
  "pygit2>=1.20,<2",
  "pylatexenc>=2.11,<3",
  "pypdf>=6.17,<7",
  "pyperclip>=1.11,<2",
  "python-docx>=1.2,<2",
  "python-dotenv>=1.2.3,<2",
  "python-frontmatter>=1.3,<2",
  "python-json-logger>=4.2,<5",
  "python-pptx>=1.0.2,<2",
  "pywinpty>=3.0.5,<4; sys_platform=='win32'",
  "rapidfuzz>=3.14.6,<4",
  "requests>=2.34.2,<3",
  "rich>=15,<16",
  "ripgrep==15.1; sys_platform!='win32'",
  # Use the standalone repository until ShadowGit is published on PyPI.
  "shadowgit @ git+https://github.com/josephsenior/ShadowGit.git@114704ea6a79a58862c1f90f51bee6d8f6305c3a",
  "tenacity>=9.1.4,<10",
  "termcolor>=3.3,<4",
  "textual>=8.2.8,<9",
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-language-pack>=1.16.2,<1.17",
  "truststore>=0.10.4,<1",
  "urllib3>=2.7,<3",
]
optional-dependencies.all = [
  "chromadb>=1.5.9,<2",
  "fastembed>=0.8,<1",
  "flashrank>=0.2.10,<1",
]
optional-dependencies.rag = [
  "chromadb>=1.5.9,<2",
  "fastembed>=0.8,<1",
  "flashrank>=0.2.10,<1",
]
urls = { Homepage = "https://github.com/josephsenior/Grinta-Coding-Agent", Repository = "https://github.com/josephsenior/Grinta-Coding-Agent", Documentation = "https://github.com/josephsenior/Grinta-Coding-Agent/tree/main/docs", Changelog = "https://github.com/josephsenior/Grinta-Coding-Agent/blob/main/CHANGELOG.md", Issues = "https://github.com/josephsenior/Grinta-Coding-Agent/issues", Discussions = "https://github.com/josephsenior/Grinta-Coding-Agent/discussions" }
# User-installable extras. Base install includes PDF/DOCX/PPTX/LaTeX parsers.
# pip install "grinta[rag]" — long-term semantic memory (Chroma + ONNX embeddings)
# pip install "grinta[all]" — rag
#
# NOTE: the `browser` extra was removed (v1.0.1). browser-use 0.13.x pins its
# entire transitive tree with exact `==` specifiers (openai==2.16.0, mcp==1.26.0,
# rich==14.3.1, requests==2.33.0, aiohttp==3.13.4, ...) which conflicts with
# Grinta's modern dependency floor, making the extra permanently unresolvable.
# The adapter in backend/execution/browser stays dormant with lazy imports and
# can be revived once browser-use adopts sane pinning. See docs/ for details.
scripts.grinta = "launch.entry:main"
scripts.grinta-deepswe = "evaluation.deepswe.run_grinta:main"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "build>=1.6",
  "debugpy>=1.8.21,<2",
  "grpcio>=1.83.1",
  "grpcio-tools>=1.83.1",
  "mutmut>=3.7",
  "mypy==2.3.1",
  "pip-audit>=2.10.1",
  "pre-commit==4.6.2",
  "pylint>=4.0.8,<5",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4,<2",
  "ruff==0.16.6",
  "tiktoken>=0.14",
  "types-pyyaml>=6.0.12.20260906",
  "types-requests>=2.33.0.20260906",
  "types-setuptools>=84.0.0.20260812",
  "types-toml>=0.10.8.20260518",
  "vulture>=2.16",
]
test = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "pytest-timeout>=2.4",
  "pytest-xdist>=3.8,<4",
  "requests>=2.34.2,<3",
]

[tool.hatch]
version.path = "backend/__init__.py"
# shadowgit is a direct git reference until it is published on PyPI.
metadata.allow-direct-references = true
build.exclude = [
  "/backend/.grinta/**",
  "/backend/conftest.py",
  "/backend/scripts/refactor/**",
  "/backend/tests/**",
  "/docs/assets/**",
  "/rustup-init.exe",
  "/traces/**",
]
build.targets.wheel.packages = [
  "backend",
  "evaluation",
  "launch",
]
build.targets.sdist.include = [
  "/backend",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/docs",
  "/evaluation",
  "/GOVERNANCE.md",
  "/launch",
  "/LICENSE",
  "/MANIFEST.in",
  "/mypy.ini",
  "/packaging",
  "/pydoc-markdown.yml",
  "/pyproject.toml",
  "/pytest.ini",
  "/README.md",
  "/rigour.yml",
  "/scripts",
  "/SECURITY.md",
  "/SHOWCASE.md",
  "/SUPPORT.md",
]
build.targets.sdist.exclude = [
  "**/*.pyc",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/__pycache__",
  "backend/conftest.py",
  "backend/scripts/refactor",
  "backend/tests",
  "scripts/__pycache__",
]

[tool.uv]
constraint-dependencies = [
  "pypdf>=6.16.1",
  "transformers<4.47.0",
]
override-dependencies = [
  "aiohttp>=3.14.3",
  "pypdf>=6.16.1",
]

[tool.ruff]
format.quote-style = "single"
lint.select = [
  "ASYNC",
  "B",
  "D",
  "E",
  "F",
  "I",
  "Q",
  "UP006", # Use `list` instead of `List` for annotations
  "UP007", # Use `X | Y` instead of `Union[X, Y]`
  "UP008", # Use `X | None` instead of `Optional[X]`
  "W",
]
lint.ignore = [
  "B003",
  "B007",
  "B009",
  "B010",
  "B018",
  "B904",
  "D1",   # Ignore warnings for missing docstrings
  "E501",
]
lint.per-file-ignores."backend/cli/event_renderer.py" = [ "E402" ]
lint.per-file-ignores."backend/cli/repl/session.py" = [ "E402" ]
lint.per-file-ignores."backend/cli/settings/onboarding.py" = [ "E402" ]
lint.per-file-ignores."backend/cli/settings/query.py" = [ "E402" ]
lint.per-file-ignores."backend/cli/settings/storage.py" = [ "E402" ]
lint.per-file-ignores."backend/integrations/mcp/mcp_utils.py" = [ "E402" ]
lint.per-file-ignores."backend/persistence/data_models/settings.py" = [ "E402" ]
lint.per-file-ignores."backend/scripts/**" = [ "ASYNC" ]
lint.per-file-ignores."backend/tests/**" = [
  "ASYNC",
  "B017",
  "B028",
  "D205",
  "D301",
  "D417",
  "E402",
  "F403",
  "F405",
  "F841",
]
lint.per-file-ignores."backend/tests/unit/cli/**/_shared.py" = [ "F401" ]
lint.per-file-ignores."packaging/vulture_whitelist.py" = [ "F821" ]
lint.flake8-bugbear.extend-immutable-calls = [ "Depends" ]
lint.flake8-quotes.docstring-quotes = "double"
lint.flake8-quotes.inline-quotes = "single"
# Use a project-local environment only: prefer `python scripts/bootstrap_env.py base`
# (or another named profile) in this repo, then `uv run …`.
# Avoid `pip install` into the global Python alongside unrelated agent stacks; that causes resolver conflicts.
lint.pydocstyle.convention = "google"

[tool.vulture]
# Find dead code: `uv run vulture` (optionally: `--min-confidence 100`).
paths = [ "backend", "launch", "packaging/vulture_whitelist.py" ]
exclude = [
  "**/__pycache__",
  "backend/conftest.py",
  "backend/evaluation",
  "backend/tests",
]
min_confidence = 90
sort_by_size = true

[tool.bandit]
exclude_dirs = [ "backend/tests", "tests" ]
# Security scanning configuration
# B101: assert used — acceptable in tests and internal assertions
# B103: set_bad_file_permissions — chmod calls are intentional for file operations
# B104: hardcoded_bind_all_interfaces — 0.0.0.0 is intentional for dev servers
# B105: hardcoded_password_string — false positives on non-password strings
# B106: hardcoded_password_funcarg — false positives on config arguments
# B107: hardcoded_password_default — false positives on empty string defaults
# B108: hardcoded_tmp_directory — /tmp paths are intentional defaults
# B110: try/except/pass — used intentionally for graceful degradation
# B112: try/except/continue — used intentionally for retry loops
# B404: import subprocess — needed for runtime command execution
# B603: subprocess_without_shell — all calls use list args (no shell injection)
# B607: start_process_with_partial_path — standard system executables (git, node, etc.)
# B310: urllib uses validated URLs only
# B608: SQL uses bound parameters; Bandit flags f-string clause assembly
skips = [
  "B101",
  "B103",
  "B104",
  "B105",
  "B106",
  "B107",
  "B108",
  "B110",
  "B112",
  "B310",
  "B404",
  "B603",
  "B607",
  "B608",
]

[tool.coverage]
run.source = [
  "backend",
]
run.omit = [
  "*/__pycache__/*",
  "*/test_*.py",
  "*/tests/*",
]
paths.source = [
  "backend",
  "/home/runner/work/Grinta-Coding-Agent/Grinta-Coding-Agent/backend",
  "D:\\a\\Grinta-Coding-Agent\\Grinta-Coding-Agent\\backend",
]
report.fail_under = 74
report.precision = 2
report.exclude_lines = [
  "@abstractmethod",
  "def __repr__",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
]
report.skip_covered = true
report.show_missing = true

[tool.mutmut]
source_paths = [
  "backend/utils/async_helpers",
  "backend/utils/lsp",
  "backend/engine/response_processing",
]
# mutmut 3.x runs pytest from inside the `mutants/` sandbox, so the whole
# importable tree (and the paths pytest.ini ignores) must exist there too.
also_copy = [
  "backend",
  "scripts/evals",
]
pytest_add_cli_args = [ "-p", "no:cacheprovider", "-q" ]
pytest_add_cli_args_test_selection = [
  "backend/tests/unit/engine/test_response_processing_edges.py",
  "backend/tests/unit/engine/orchestrator/tools/test_lsp_query.py",
  "backend/tests/unit/execution/utils/test_tenacity_stop.py",
  "backend/tests/unit/orchestration/test_agent_circuit_breaker.py",
  "backend/tests/unit/orchestration/services/test_circuit_breaker_service.py",
  "backend/tests/unit/utils/test_circuit_breaker.py",
  "backend/tests/unit/utils/test_lsp_client_edges.py",
  "backend/tests/unit/utils/test_lsp_client_helpers.py",
  "backend/tests/unit/utils/test_lsp_project_routing.py",
  "backend/tests/unit/utils/test_lsp_session_edges.py",
  "backend/tests/unit/utils/test_lsp_session_reader.py",
  "backend/tests/unit/utils/test_lsp_session.py",
  "backend/tests/unit/utils/test_lsp_timeouts.py",
  "backend/tests/unit/utils/test_tenacity_metrics.py",
  "backend/tests/unit/utils/test_tenacity_stop.py",
]
timeout_multiplier = 2.0
