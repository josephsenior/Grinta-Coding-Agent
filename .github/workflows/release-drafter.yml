name: Draft Release Notes

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, closed, labeled, unlabeled]

permissions:
  contents: write

jobs:
  update-release-draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Update draft release
        uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
