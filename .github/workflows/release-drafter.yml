name: Draft Release Notes

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, closed, labeled, unlabeled]

permissions:
  contents: write

jobs:
  update-release-draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Update draft release
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
